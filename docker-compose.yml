services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slate_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slate_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/slate_inventory
      FRONTEND_URL: http://localhost:8080
      JWT_ACCESS_SECRET: local-docker-access-secret-change-this
      JWT_REFRESH_SECRET: local-docker-refresh-secret-change-this
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
